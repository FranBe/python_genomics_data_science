[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "python_genomics_data_science"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "awscli",
    "biopython>=1.88",
    "loguru",
    "matplotlib>=3.11.2",
    "mkdoc>=0.1",
    "mkdocs",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "seaborn>=0.13.2",
    "snakemake>=9.21.0",
    "tqdm",
    "typer",
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["python_genomics_data_science"]
include = ["pyproject.toml", "python_genomics_data_science/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["python_genomics_data_science"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]

